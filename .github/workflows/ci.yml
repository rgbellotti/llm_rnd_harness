name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  # Single-threaded: the process-tree tests (harden re-exec, sudo
  # reaper, pid-namespace supervisor) can kill a shared parallel
  # runner. See the Development section of the README.
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -- --test-threads=1

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: web/js/run_tests.sh

  web-tool:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --project web_tool
      # The fetch-policy tests launch real Chromium (the rebinding and
      # partial-load classes); a fresh runner has no browser cache.
      - run: uv run --project web_tool playwright install --with-deps chromium
      # Hosted runners do not expose unprivileged user namespaces, so
      # Chromium's OS sandbox cannot start there. WEB_TOOL_NO_SANDBOX=1
      # is the tool's documented opt-out for exactly that case; the
      # tests exercise the SSRF policy, not the sandbox.
      - run: >
          uv run --locked --no-sync --project web_tool
          python -m unittest discover -s web_tool/tests
        env:
          WEB_TOOL_NO_SANDBOX: "1"
